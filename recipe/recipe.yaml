schema_version: 1

context:
  version: "1.27.3"

package:
  name: go-${{ go_variant_str }}-compiler
  version: ${{ version }}

source:
  # needed for autotick bot autoupdates
  url: https://dl.google.com/go/go${{ version }}.src.tar.gz
  sha256: 6e7749035cf360f06b2575d162ea79df9fda8ef671889e5c375f8e50777f26bb

build:
  skip: go_variant_str == "cgo" and target_platform == "win-arm64"
  number: 0

requirements:
  run:
    - go-${{ go_variant_str }}_${{ target_platform }} ${{ version }}.*

tests:
  - script:
      # telemetry counter files are written asynchronously into $HOME, which
      # races with the test directory cleanup
      - go telemetry off
      - go help
      - if: unix
        then: test "$CONDA_GO_COMPILER" = "1"
        else: if not "%CONDA_GO_COMPILER%"=="1" exit /b 1

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A metapackage to select a Go compiler (not for use in recipes)
  homepage: https://conda-forge.org

extra:
  feedstock-name: go-compiler
  recipe-maintainers:
    - conda-forge/go
